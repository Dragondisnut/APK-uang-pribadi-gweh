name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          if [ -f settings.gradle.kts ]; then DIR=.; else DIR=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)"); fi
          echo "Proyek ada di: $DIR"
          cd "$DIR"
          gradle assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/KasKu.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: KasKu-apk
          path: out/KasKu.apk
